# =============================================================================
# tests — matriz Linux + Windows com JUnit e cobertura · stream95
#
# Actions fixadas pelo SHA do commit (versão no comentário). Para atualizar: troque a
# versão no comentário e rode oss-pin-actions.sh da skill opensource-project.
#
# CONTEXT DE REQUIRED STATUS CHECK: o ruleset exige o NOME DO JOB (não
# `workflow / job`). Como a matriz gera um nome por combinação, o job agregador
# `tests-ok` (nome estável) é o `context` a exigir em
# assets/rulesets/regras-main.json → required_status_checks[].context.
# =============================================================================

name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Privilégio mínimo: testes só leem o repositório.
permissions:
  contents: read

# Um run por ref; o novo cancela o obsoleto (poupa minutos).
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.runtime-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows é a plataforma principal (OBS); Linux garante portabilidade.
        os: [ubuntu-latest, windows-latest]
        runtime-version: ["22"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.runtime-version }}
          cache: npm # cache por hash do package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Run tests (JUnit + coverage)
        run: |
          mkdir -p test-results
          npx vitest run --reporter=junit --outputFile=test-results/junit.xml \
            --coverage --coverage.reporter=text --coverage.reporter=lcov
      # Artefactos: nome ÚNICO por combinação de matriz (v4: nomes imutáveis no
      # run — colisão devolve 409) e `if: always()` para subir relatórios mesmo
      # com falha. Retenção curta poupa armazenamento.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.runtime-version }}
          path: test-results/
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.runtime-version }}
          path: coverage/
          retention-days: 14

  # Job agregador: nome ESTÁVEL → é este o `context` do required status check.
  # Se qualquer perna da matriz falhar, este job falha e o PR fica bloqueado.
  tests-ok:
    name: tests-ok
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any matrix leg failed
        if: needs.test.result != 'success'
        run: |
          echo "::error::Houve pernas da matriz com falha — ver o job 'test'"
          exit 1
      - name: Sumário do run
        run: echo "### tests ✅" >> "$GITHUB_STEP_SUMMARY"
