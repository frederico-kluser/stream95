# Atualizações automáticas de dependências. Os PRs usam ramificações `dependabot/*`
# (liberadas pelo ruleset de nomes) e mensagens convencionais (`build(deps): ...`).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Espera uma semana antes de propor uma versão recém-publicada (cadeia de suprimentos).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
