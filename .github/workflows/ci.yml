# =============================================================================
# CI — stream95 (frederico-kluser/stream95)
#
# Actions fixadas pelo SHA do commit (versão no comentário). Para atualizar: troque a
# versão no comentário e rode oss-pin-actions.sh da skill opensource-project.
#
# Stack: Node 22 + npm workspaces (Biome, TypeScript, Vitest, Vite, tsup).
# =============================================================================

name: CI

on:
  push:
    branches:
      - "main"
  pull_request:

# Privilégio mínimo: o CI só precisa de ler o repositório.
permissions:
  contents: read

# Evita corridas duplicadas e desperdiçadas no mesmo PR/ramo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  test:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Job AGREGADOR — o seu NOME (`build`) é o `context` exigido pelo ruleset
  # (assets/rulesets/regras-main.json). Não renomeie sem atualizar o ruleset.
  # Além de agregar lint+test, valida as mensagens de commit: é assim que os
  # Conventional Commits são impostos TAMBÉM no servidor — a regra de metadata
  # `commit_message_pattern` é Enterprise-only, enquanto este check funciona em
  # qualquer plano e bloqueia o merge com mensagens fora do padrão.
  build:
    name: build
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo: valida TODOS os commits do PR

      # O título do PR vira a mensagem do squash: é validado junto com os commits.
      # Dados do evento entram por variáveis de ambiente (nunca interpolados no script).
      - name: Commits convencionais (título do PR + commits do PR)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          header = re.compile(r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]*\))?!?: .+')
          skip = re.compile(r'^(Merge |Revert "|Reapply "|fixup!|squash!)')
          base, head = os.environ.get('BASE_SHA'), os.environ.get('HEAD_SHA')
          rng = [f'{base}..{head}'] if base and head else ['-n', '1', 'HEAD']  # push: o squash do PR
          out = subprocess.run(['git', 'log', '--pretty=tformat:%s', *rng],
                               capture_output=True, text=True, check=True).stdout
          subjects = ([os.environ['PR_TITLE']] if os.environ.get('PR_TITLE') else []) + out.splitlines()
          bad = 0
          for s in subjects:
              s = s.strip()
              if not s or skip.match(s):
                  continue
              h = re.sub(r'\s+\(#\d+\)$', '', s)   # sufixo "(#N)" do squash não conta
              if not header.match(h) or len(h) > 72:
                  print('ERRO: mensagem fora de Conventional Commits:', s); bad = 1
              else:
                  print('OK  :', s)
          sys.exit(bad)
          PY
